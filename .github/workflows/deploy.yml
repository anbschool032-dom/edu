name: Deploy Backend

on:
  push:
    branches:
      - adminServer  # ✅ ត្រូវប្រាកដថាឈ្មោះនេះត្រូវ

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /var/www/careersync/backend
          
          # 🔥 កែត្រង់នេះ៖ ឱ្យវាចាប់យកកូដថ្មីពី adminServer
          git fetch --all
          git reset --hard origin/adminServer
          
          # Restart Server
          npm install
          pm2 restart all --update-env
          
          echo "✅ Backend Deployed Successfully!"